# 本機預覽環境：使用 build 之後的產物啟動（next start），不掛載原始碼、不即時編譯、沒有熱重載
# 資料庫沿用原本開發環境的容器名稱與 ./data/dev-db，所以既有的路線與使用者資料都在
services:
    db:
        image: postgres:18-alpine
        container_name: fssh-bus-db-dev
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - ./data/dev-db:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    nextjs:
        build:
            context: .
            target: preview
            args:
                NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
                NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN: ${NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN}
        container_name: fssh-bus-nextjs-preview
        restart: unless-stopped
        env_file: .env
        ports:
            - "3000:3000"
        depends_on:
            db:
                condition: service_healthy
