# 鳳山高中專車登記系統 — Nginx 主設定（單一檔案，取代 conf.d 資料夾）
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    keepalive_timeout   65;
    client_max_body_size 1m;

    # 壓縮文字類回應，手機網路載入較快
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rate limit（皆以 IP 計算，burst=20 允許瞬間峰值約 20 次）：
    #   auth_limit：登入端點 /api/auth/，每 IP 每分鐘 10 次（rate=10r/m）
    #   api_limit ：一般 API /api/，每 IP 每秒 1 次（rate=1r/s）
    # 登入端點與一般 API 使用各自獨立的計數器，登入不會吃掉一般 API 的額度。
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=1r/s;
    limit_req_status 429;

    upstream nextjs_upstream {
        server nextjs:3000;
    }

    # 兜底：Host 不符（用 IP 直連、掃描器、別的網域指過來）一律直接斷線。
    # 若要在上線初期用 IP 測試，暫時註解這個區塊即可。
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name bus.fssh.khc.edu.tw;

        # certbot 憑證驗證路徑
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 尚未簽發 SSL 憑證前，先以 HTTP 代理提供服務。
        # 取得憑證並啟用下方 443 server{} 區塊後，這裡的 location / 要換成：
        #   location / { return 301 https://$host$request_uri; }

        # 登入端點（獨立計數）
        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 一般 API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js 靜態檔：檔名帶內容雜湊，可長期快取
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── 取得 SSL 憑證後（見 README「首次簽發 SSL 憑證」步驟），取消下面整段註解即可啟用 HTTPS ──
    # 同時記得：
