# 鳳山高中專車登記系統 — Nginx 主設定（單一檔案，取代 conf.d 資料夾）
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    keepalive_timeout   65;

    # Rate limit：每 IP 每分鐘 30 次（rate=30r/m），burst=10 允許瞬間峰值約 40 次
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_status 429;

    upstream nextjs_upstream {
        server nextjs:1135;
    }

    server {
        listen 80;
        server_name bus.fssh.khc.edu.tw;

        # certbot 憑證驗證路徑
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 尚未簽發 SSL 憑證前，先以 HTTP 代理提供服務。
        # 取得憑證並啟用下方 443 server{} 區塊後，這裡的 location / 要換成：
        #   location / { return 301 https://$host$request_uri; }

        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── 取得 SSL 憑證後（見 README「首次簽發 SSL 憑證」步驟），取消下面整段註解即可啟用 HTTPS ──
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name bus.fssh.khc.edu.tw;
    #
    #     ssl_certificate     /etc/letsencrypt/live/bus.fssh.khc.edu.tw/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/bus.fssh.khc.edu.tw/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers on;
    #
    #     add_header X-Content-Type-Options nosniff always;
    #     add_header X-Frame-Options DENY always;
    #     add_header Referrer-Policy strict-origin-when-cross-origin always;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; img-src 'self' data: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self' data:; base-uri 'self'; frame-ancestors 'none'" always;
