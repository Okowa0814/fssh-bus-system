services:
    nginx:
        image: nginx:1.27-alpine
        container_name: fssh-bus-nginx
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - ./certbot/www:/var/www/certbot:ro
            - ./certbot/conf:/etc/letsencrypt:ro
        depends_on:
            - nextjs
        networks:
            - busnet

    # SSL 憑證自動續期（首次簽發流程見 README）
    certbot:
        image: certbot/certbot
        container_name: fssh-bus-certbot
        restart: unless-stopped
        volumes:
            - ./certbot/www:/var/www/certbot
            - ./certbot/conf:/etc/letsencrypt
        entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

    nextjs:
        build:
            context: .
            target: runner
            args:
                NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
                NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN: ${NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN}
        container_name: fssh-bus-nextjs
        restart: unless-stopped
        env_file: .env
        expose:
            - "3000"
        depends_on:
            db:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        networks:
            - busnet

    # 一次性任務：同步資料表結構（路線／班次改由後台「路線管理」頁面建立，不再寫入初始資料）
    migrate:
        build:
            context: .
            target: migrate
        container_name: fssh-bus-migrate
        env_file: .env
        depends_on:
            db:
                condition: service_healthy
        networks:
            - busnet

    db:
        image: postgres:18-alpine
        container_name: fssh-bus-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            # 掛載至實體主機，容器重啟資料不遺失
            # PostgreSQL 18+ 官方映像檔改成掛載到 /var/lib/postgresql（非 .../data），
            # 資料實際存在版本相關子目錄，見 https://github.com/docker-library/postgres/pull/1259
            - ./data/postgres:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - busnet

    # 每日排程備份：pg_dump 壓縮後存到 ./data/backups，保留最近 14 天，還原方式見 README
    backup:
        image: postgres:18-alpine
        container_name: fssh-bus-backup
        restart: unless-stopped
        environment:
            PGHOST: db
            PGUSER: ${POSTGRES_USER}
            PGPASSWORD: ${POSTGRES_PASSWORD}
            PGDATABASE: ${POSTGRES_DB}
        volumes:
            - ./data/backups:/backups
        entrypoint: >
            /bin/sh -c '
            trap exit TERM;
            while :; do
                pg_dump | gzip > "/backups/$$(date +%Y%m%d_%H%M%S).sql.gz";
                find /backups -name "*.sql.gz" -mtime +14 -delete;
                sleep 24h & wait $${!};
            done'
        depends_on:
            db:
                condition: service_healthy
        networks:
            - busnet

networks:
    busnet:
        driver: bridge
