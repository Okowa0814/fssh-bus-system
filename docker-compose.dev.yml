services:
    db:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            # PostgreSQL 18+ 官方映像檔改成掛載到 /var/lib/postgresql（非 .../data），
            # 資料實際存在版本相關子目錄，見 https://github.com/docker-library/postgres/pull/1259
            - ./data/dev-db:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        ports:
            - "6379:6379"
        volumes:
            - ./data/dev-redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    nextjs:
        build:
            context: .
            target: dev
        restart: unless-stopped
        env_file: .env
        ports:
            - "1135:1135"
        volumes:
            - .:/app
            - /app/node_modules
            - /app/.next
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
